name: Windows 检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: 验证 HTTP 代理请求格式
        shell: pwsh
        run: |
          # 第三方库不是主工作区成员，独立复制后运行其自身测试和开发依赖。
          $ureqTests = Join-Path $env:RUNNER_TEMP 'win-island-ureq-tests'
          Copy-Item -LiteralPath vendor/ureq -Destination $ureqTests -Recurse
          cargo +stable test --manifest-path (Join-Path $ureqTests 'Cargo.toml') --lib --no-default-features --features tls,gzip --target x86_64-pc-windows-msvc unit::tests
          if ($LASTEXITCODE -ne 0) { throw 'HTTP 代理回归失败' }
      - name: 测试
        run: cargo +stable test --locked --workspace --all-targets --features record --target x86_64-pc-windows-msvc -- --test-threads=1
      - name: 检查安装脚本语法
        shell: pwsh
        run: |
          Get-ChildItem installer,scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$null,[ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: 构建独立免安装包
        shell: pwsh
        run: ./scripts/package-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WinIslandRust-windows-x64
          path: dist/*.zip
