name: 发布 Windows 便携版
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - app.rc
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: release-windows
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 确定版本与发布状态
        id: version
        shell: pwsh
        run: |
          $version = ((Get-Content Cargo.toml | Select-String '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value)
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw '版本号无效' }
          "version=$version" >> $env:GITHUB_OUTPUT
          $existing = gh release list --json tagName --jq ".[] | select(.tagName == `"v$version`") | .tagName"
          if ($LASTEXITCODE -ne 0) { throw '无法检查现有 Release' }
          "publish=$([string]::IsNullOrWhiteSpace($existing).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: 查找可复用的 CI 构建
        if: steps.version.outputs.publish == 'true'
        id: artifact
        shell: pwsh
        run: |
          $runs = gh run list --workflow ci.yml --branch main --limit 20 --json databaseId,headSha,status,conclusion | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw '无法读取 CI 构建' }
          foreach ($candidate in $runs) {
            if ($candidate.headSha -eq $env:GITHUB_SHA -or ($candidate.conclusion -and $candidate.conclusion -ne 'success')) { continue }
            $comparison = gh api "repos/$env:GITHUB_REPOSITORY/compare/$($candidate.headSha)...$env:GITHUB_SHA" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw '无法核对构建来源' }
            if ($comparison.status -notin @('ahead','identical')) { continue }
            if (@($comparison.files | Where-Object { $_.filename -notlike '.github/workflows/*' }).Count -ne 0) { continue }
            if ($candidate.status -ne 'completed') {
              gh run watch $candidate.databaseId --exit-status --interval 15
              if ($LASTEXITCODE -ne 0) { continue }
            }
            "run_id=$($candidate.databaseId)" >> $env:GITHUB_OUTPUT
            break
          }
      - name: 安装 Rust stable
        if: steps.version.outputs.publish == 'true' && steps.artifact.outputs.run_id == ''
        run: rustup toolchain install stable --profile minimal
      - name: Rust 回归
        if: steps.version.outputs.publish == 'true' && steps.artifact.outputs.run_id == ''
        run: cargo +stable test --locked --workspace --all-targets --features record --target x86_64-pc-windows-msvc -- --test-threads=1
      - name: DSH 桥接回归
        if: steps.version.outputs.publish == 'true'
        run: node --test plugins/dsh-island-bridge/test/*.test.mjs
      - name: 生成便携包
        if: steps.version.outputs.publish == 'true' && steps.artifact.outputs.run_id == ''
        shell: pwsh
        run: ./scripts/package-portable.ps1
      - name: 下载已验证的便携包
        if: steps.version.outputs.publish == 'true' && steps.artifact.outputs.run_id != ''
        shell: pwsh
        env:
          SOURCE_RUN_ID: ${{ steps.artifact.outputs.run_id }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh run download $env:SOURCE_RUN_ID --name WinIslandRust-windows-x64 --dir dist
          if ($LASTEXITCODE -ne 0) { throw '下载 CI 便携包失败' }
          $name = "LingDongIsland-$env:RELEASE_VERSION-windows-x64.zip"
          $package = Join-Path dist $name
          if (-not (Test-Path -LiteralPath $package)) { throw 'CI 附件版本不符' }
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath "$package.sha256" -Encoding ascii
      - name: 发布 Release 与校验文件
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String "^## 灵动岛 v$([regex]::Escape($version))" | Select-Object -First 1).LineNumber
          if (-not $start) { throw '缺少当前版本的更新说明' }
          $notes = @()
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## ') { break }
            if ($lines[$i] -eq '以下保留上游历史更新记录。') { break }
            $notes += $lines[$i]
          }
          $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8
          # 只从当前默认分支提交发布，防止旧提交的工作流差异触发额外权限要求。
          $head = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw '主分支已更新，请从最新提交重新发布' }
          gh release create "v$version" "dist/LingDongIsland-$version-windows-x64.zip" "dist/LingDongIsland-$version-windows-x64.zip.sha256" --target $env:GITHUB_SHA --title "灵动岛 v$version" --notes-file release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release 发布失败' }
